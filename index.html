<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:20px;
}

h1{
    margin-bottom:20px;
}

#board{
    display:grid;
    grid-template-columns:repeat(9,50px);
    width:450px;
    margin:auto;
    border:3px solid black;
}

.cell{
    width:50px;
    height:50px;
    font-size:24px;
    text-align:center;
    border:1px solid #ccc;
    box-sizing:border-box;
}

.fixed{
    background:#eaeaea;
    font-weight:bold;
}

button{
    margin:10px 5px;
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
}

#message{
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>Sudoku</h1>

<div id="board"></div>

<div>
    <button onclick="newGame()">New Game</button>
    <button onclick="checkSolution()">Check</button>
    <button onclick="resetGame()">Reset</button>
</div>

<div id="message"></div>

<script>
// Sudoku logic here
</script>

</body>
</html>
